[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bridge"
version = "0.2.0"
description = "Bi-Directional AI Communication MCP Bridge for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
bridge-mcp = "claude_bridge.cli:main"

[tool.setuptools]
packages = ["claude_bridge"]

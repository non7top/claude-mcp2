[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-mcp2"
version = "0.1.0"
description = "Bi-Directional AI Communication MCP Bridge for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
bridge-mcp = "bridge_mcp:main"

[tool.setuptools]
py-modules = ["bridge_mcp"]
